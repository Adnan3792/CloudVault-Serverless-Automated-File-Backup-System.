<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CloudVault - Create Account</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <main class="auth-container">

        <div class="auth-card">

            <div class="brand">

                <div class="logo-large">
                    ☁
                </div>

                <h1>CloudVault</h1>

                <p>
                    Create your secure backup account
                </p>

            </div>


            <form id="signupForm">

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="signupEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="signupEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="signupPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="signupPassword"
                        placeholder="Create a password"
                        minlength="8"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        minlength="8"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="primary-btn"
                >
                    Create Account
                </button>

            </form>


            <p
                id="signupMessage"
                class="message"
            ></p>


            <div class="auth-footer">

                <p>
                    Already have an account?
                </p>

                <a href="login.html">
                    Login
                </a>

            </div>

        </div>

    </main>


    <script src="app.js"></script>

</body>
</html>
